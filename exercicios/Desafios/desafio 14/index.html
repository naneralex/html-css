<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 14</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        th {
            background-color: grey;
            color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        .semfundo {
            background-color: white;
            color: black;
        }

        .comfundo {
            background-color: gray;
            color: white;
        }

        .alinhadoesquerda {
            text-align: left;
        }

        .centralizado {
            text-align: center;
        }

        #center {
            text-align: center;
            font-weight: bold;
        }
    </style>



</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Área</th>
                <th>Disciplia</th>
                <th  colspan="2">Notas</th>
                <th>Media</th>
            </tr>
        
        </thead>

        <tbody>
            <tr>
                <th rowspan="4" class="semfundo">Exatas</th>
                <td>Matemática</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="alinhadoesquerda">Média de Exatas</th>
                <td class="comfundo" id="center">0.0</td>
            </tr>
            <tr>
                <th rowspan="2" class="semfundo">Humanas</th>
                <td>História</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
                <td class="centralizado">0.0</td>
            </tr>
            <tr>
                <th colspan="4" class="alinhadoesquerda">Média de Humanas</th>
                <td class="comfundo" id="center">0.0</td>
            </tr>
        </tbody>
            
     
    </table>
    
</body>
</html>
