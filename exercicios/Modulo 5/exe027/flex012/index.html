<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>

    <style>
        div.container {
            background-color: lightsalmon;
            
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        div#cxA{
            /*
            flex: flex-grow + flex-shrink + flex-basis

            flex: 0 1 auto (padrão)
            flex: initial (também padrão)

            flex: 0 0 auto (não ser flexível)
            flex: none (também não ser flexível)

            flex: 1 1 auto (totalmente flexível)
            flex: auto (também totalmente flexível)

            flex: 3 (ou outro valor) apenas o valor de grow
            flex: 3 1 auto (shrink e basis fica padrão)

            flex-grow: 1;
            flex-shrink: 0;
            flex-basis: 200px;
            */

            flex: 1 0 200px;
            
        }

        div#cxB {
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 200px;
        }

        div#cxC {
            flex-grow: 1;
            flex-shrink: 8;
            flex-basis: 200px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
    
</body>
</html>
