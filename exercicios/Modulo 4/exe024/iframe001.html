<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe 001</title>

    <style>
        iframe {
            width: 400px;
            height: 400px;
        }
    </style>

</head>

<body>

    <!-- Tamanho padrão do iFrame é 300x500 
     Posso alterar usando o width e o height-
     
     Usando configurações CSS o que vale pro iframe é a css e não
     a configuração colocada direto no iframe do html

    scolling é usado para não deixar o site rolar (auto / no)
     -->

    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">Curso em vídeo</a> para aprender a programar</p>

    <p>exemplo</p>

    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" scolling"no"></iframe> Curso em vídeo</a> para aprender a programar</p>

    <p>para sites não compatveis como o google por exemplo, posso arescentar o link do site</p>

    <p>O site do google não é compátivel com iFrame 
        <iframe src="https://www.google.com.br" frameborder="0" height="500" width="500">
            <a href="https://www.google.com.br" target="_blank">Site do Google</a>
        </iframe>
    </p>
    
</body>


</html>
